name: Keepalive

# Defeats GitHub's 60-day disable of scheduled workflows. Upstream can be quiet
# for two months, and a quiet upstream produces no commits, which is exactly
# what silences update.yml.
#
# UNVERIFIED: whether a commit authored by GITHUB_TOKEN counts as the
# "repository activity" that rearms the timer. If update.yml ever goes quiet for
# longer than upstream did, run it from the Actions tab and treat this file as
# not working.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/heartbeat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/heartbeat
          git commit -m "chore: heartbeat" || exit 0
          git push
